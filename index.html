        }
        .font-serif-title {

        }

            backdrop-filter: blur(8px);
        }
        .french-badge {
            background-color: #fcf0e4;
            border: 1px solid #ebd0bc;
            color: #b05c30;
        }
        .dish-card {
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .dish-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -2px rgba(180, 130, 100, 0.15);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

            -ms-overflow-style: none;
            scrollbar-width: none;

                    { id: "d1_1", name: "咖喱牛腩", price: 8.0, type: "normal", desc: "浓郁咖喱炖煮软烂大块牛腩" },
                    { id: "d1_2", name: "番茄牛腩", price: 8.0, type: "normal", desc: "浓郁番茄酸甜汤汁搭配炖牛腩" }
                ]
            }
        ];

        // Selected Items Tracking
        const selectedItems = {};
        let hasAddon = false;

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            menuData.forEach(cat => {
                const section = document.createElement('div');
                section.className = 'french-card p-4 space-y-3';

                let html = `
                    <div class="flex items-center justify-between border-b border-[#f0cca8] pb-2.5">
                        <h2 class="font-bold text-base text-[#5c3e31] font-serif-title flex items-center gap-2">
                            <span class="text-lg">${cat.icon}</span>
                            <span>${cat.category}</span>
                        </h2>
                    </div><div class="space-y-3 pt-1">
                `;

                cat.items.forEach(item => {
                    const sel = selectedItems[item.id] || { count: 0, noodleType: '细面', isHandPulled: false };
                    const isSelected = sel.count > 0;
                    const imgUrl = dishImages[item.id] || dishImages["m1"];

                    html += `
                        <div class="dish-card p-2.5 rounded-2xl border ${isSelected ? 'border-[#e88958] bg-[#fdf6f0] shadow-sm' : 'border-[#f2d8c4]/80 bg-white/80'} transition-all flex flex-col gap-2">
                            <div class="flex items-center justify-between gap-3">
                                <div class="w-14 h-14 rounded-xl overflow-hidden bg-[#faf0e6] shrink-0 border border-[#edd7c7] flex items-center justify-center shadow-inner">
                                    <img src="${imgUrl}" alt="${item.name}" class="w-12 h-12 object-contain" />
                                </div>
                                <div class="flex-1 min-w-0">
                                    <h4 class="font-bold text-sm text-[#4a3528] truncate font-serif-title">${item.name}</h4>
                                    <p class="text-[10px] text-[#916d5b] truncate mt-0.5">${item.desc}</p>
                                    <div class="text-[#c25a2b] font-bold text-xs mt-1">${item.price.toFixed(1)} €</div>
                                </div>
                                <div class="flex items-center gap-2 shrink-0">
                                    ${isSelected ? `
                                        <button onclick="updateCount('${item.id}', -1)" class="w-6 h-6 rounded-full bg-white border border-[#e0b89d] text-[#a65633] flex items-center justify-center font-bold active:scale-90 shadow-sm">
                                            <i class="fa-solid fa-minus text-[9px]"></i>
                                        </button>
                                        <span class="w-4 text-center font-bold text-xs text-[#52372a]">${sel.count}</span>
                                    ` : ''}
                                    <button onclick="updateCount('${item.id}', 1)" class="w-6 h-6 rounded-full ${isSelected ? 'bg-[#d96752] text-white' : 'bg-[#f7e4d5] text-[#8c5038] border border-[#e8be9d]'} flex items-center justify-center font-bold active:scale-90 transition-colors shadow-sm">
                                        <i class="fa-solid fa-plus text-[9px]"></i>
                                    </button>
                                </div>
                            </div>
                    `;

                    // If Noodle Item Selected: options
                    if (item.type === 'noodle' && isSelected) {
                        html += `
                            <div class="mt-1 pt-2 border-t border-dashed border-[#f0cca8] text-xs">
                                <div class="flex items-center justify-between flex-wrap gap-1.5">
                                    <span class="text-[#8c5d47] font-semibold text-[10px]">🍜 面条搭配:</span>
                                    <div class="flex gap-1">
                                        <button onclick="setNoodleOption('${item.id}', '细面', false)" class="px-2 py-0.5 rounded-md border text-[10px] font-bold transition ${sel.noodleType === '细面' && !sel.isHandPulled ? 'bg-[#d96752] text-white border-[#d96752] shadow-sm' : 'bg-white text-[#664b3c] border-[#e0c4b0]'}">细面</button>
                                        <button onclick="setNoodleOption('${item.id}', '扁意面', false)" class="px-2 py-0.5 rounded-md border text-[10px] font-bold transition ${sel.noodleType === '扁意面' && !sel.isHandPulled ? 'bg-[#d96752] text-white border-[#d96752] shadow-sm' : 'bg-white text-[#664b3c] border-[#e0c4b0]'}">扁意面</button>
                                        <button onclick="setNoodleOption('${item.id}', '手扯面', true)" class="px-2 py-0.5 rounded-md border text-[10px] font-bold transition ${sel.isHandPulled ? 'bg-[#b84d3d] text-white border-[#b84d3d] shadow-sm' : 'bg-[#faede2] text-[#b84d3d] border-[#f0cca8]'}">手扯面 (+1€)</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }

                    html += `</div>`;
                });

                html += `</div>`;
                section.innerHTML = html;
                container.appendChild(section);
            });
        }

        function updateCount(itemId, delta) {
            if (!selectedItems[itemId]) {
                if (delta > 0) {
                    selectedItems[itemId] = { count: 1, noodleType: '细面', isHandPulled: false };
                }
            } else {
                selectedItems[itemId].count += delta;
                if (selectedItems[itemId].count <= 0) {
                    delete selectedItems[itemId];
                }
            }
            renderMenu();
            updateSummaryBar();
        }

        function setNoodleOption(itemId, noodleType, isHandPulled) {
            if (selectedItems[itemId]) {
                selectedItems[itemId].noodleType = noodleType;
                selectedItems[itemId].isHandPulled = isHandPulled;
                renderMenu();
                updateSummaryBar();
            }
        }

        function toggleAddon(checkbox) {
            hasAddon = checkbox.checked;
            updateSummaryBar();
        }

        function calculateTotal() {
            let totalCount = 0;
            let totalPrice = 0;

            for (const id in selectedItems) {
                const item = findItemById(id);
                const sel = selectedItems[id];
                if (item) {
                    totalCount += sel.count;
                    let itemUnitPrice = item.price;
                    if (sel.isHandPulled) {
                        itemUnitPrice += 1.0;
                    }
                    totalPrice += itemUnitPrice * sel.count;
                }
            }

            if (hasAddon) {
                totalPrice += 1.0;
            }

            return { totalCount, totalPrice };
        }

        function findItemById(id) {
            for (const cat of menuData) {
                const found = cat.items.find(i => i.id === id);
                if (found) return found;
            }
            return null;
        }

        function updateSummaryBar() {
            const { totalCount, totalPrice } = calculateTotal();
            document.getElementById('total-items-count').innerText = totalCount;
            document.getElementById('badge-count').innerText = totalCount + (hasAddon ? 1 : 0);
            document.getElementById('total-price').innerText = totalPrice.toFixed(2);
        }

        function openOrderModal() {
            const { totalCount, totalPrice } = calculateTotal();
            if (totalCount === 0 && !hasAddon) {
                showToast("请先选择您喜爱的美食菜品哦 😋");
                return;
            }

            let text = "🍷【朱莉娅的小厨房 · 确认点单】🍷\n";
            text += "-----------------------------------\n";

            for (const id in selectedItems) {
                const item = findItemById(id);
                const sel = selectedItems[id];
                if (item) {
                    let linePrice = item.price;
                    let desc = `${item.name} × ${sel.count}`;
                    if (item.type === 'noodle') {
                        if (sel.isHandPulled) {
                            desc += ` (手扯面 +1€)`;
                            linePrice += 1.0;
                        } else {
                            desc += ` (${sel.noodleType}, 免费)`;
                        }
                    }
                    text += `• ${desc} : ${(linePrice * sel.count).toFixed(1)}€\n`;
                }
            }

            if (hasAddon) {
                text += `• 🍱 盲盒加购：米饭 + 每日精选盲盒菜品 : 1.0€\n`;
            }

            text += "-----------------------------------\n";
            text += `💰 订单金额总计：${totalPrice.toFixed(2)} €\n`;
            text += "期待朱莉娅主厨的美味烹饪！Bon Appétit 💕";

            document.getElementById('modal-order-content').innerText = text;
            document.getElementById('order-modal').classList.remove('hidden');
        }

        function closeOrderModal() {
            document.getElementById('order-modal').classList.add('hidden');
        }

        function copyOrderText() {
            const text = document.getElementById('modal-order-content').innerText;
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast("复制成功！快去黏贴发送给朱莉娅吧 💌");
                document.getElementById('copy-btn-text').innerText = "已成功复制 ✓";
                setTimeout(() => {
                    document.getElementById('copy-btn-text').innerText = "复制点单明细 📋";
                }, 2000);
            } catch (err) {
                showToast("复制失败，请手动选择复制文本");
            }
            document.body.removeChild(textarea);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        window.onload = function() {
            renderMenu();
        };
    </script>
</body>
</html>
